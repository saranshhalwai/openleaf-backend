apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: openleaf-backend
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "10"
        autoscaling.knative.dev/minScale: "0"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - image: gcr.io/openleaf-508614/openleaf-backend:latest
        ports:
        - name: http1
          containerPort: 8080
        resources:
          limits:
            memory: 256Mi
            cpu: "1000m"
        startupProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 2
          failureThreshold: 15
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: DATABASE_URL
              key: latest
        - name: PORT
          value: "8080"
        - name: ENV
          value: "production"
        - name: ALLOWED_ORIGINS
          value: "https://openleaf.saranshhalwai.me,http://localhost:5173"
